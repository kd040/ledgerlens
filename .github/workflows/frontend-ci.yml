name: Frontend CI

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      # The application already falls back to http://localhost:8000 when
      # this is unset (see frontend/src/api/client.ts), so the build never
      # depends on the secret existing. Setting the repository secret
      # CI_VITE_API_BASE_URL only overrides the baked-in default; nothing
      # here is required for the workflow to pass.
      VITE_API_BASE_URL: ${{ secrets.CI_VITE_API_BASE_URL || 'http://localhost:8000' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend tests
        working-directory: frontend
        run: npm test -- --run

      - name: TypeScript check
        working-directory: frontend
        run: npx tsc -b

      - name: Lint
        working-directory: frontend
        run: npx oxlint .

      - name: Production build
        working-directory: frontend
        run: npm run build
